<script>
let allData = [];

// 手动配置要加载的 Markdown 文件列表
// 本地使用：填写相对路径
// GitHub Pages：填写仓库中的文件路径
const MD_FILES = [
    '命令集.md',
    '新建文本文档.md',
    'ufw.md',
    'win.md',
    'esxi.md',
    'bash.md',
    // 添加更多文件...
];

async function init() {
    try {
        // 并行加载所有配置的 .md 文件
        const promises = MD_FILES.map(async (filename) => {
            try {
                const response = await fetch(filename);
                if (!response.ok) {
                    console.warn(`无法加载 ${filename}`);
                    return [];
                }
                const rawText = await response.text();
                return parseMarkdownContent(filename, rawText);
            } catch (err) {
                console.error(`加载 ${filename} 失败:`, err);
                return [];
            }
        });
        
        const results = await Promise.all(promises);
        allData = results.flat();
        
        console.log(`成功加载 ${MD_FILES.length} 个文件，共 ${allData.length} 个章节`);

        if (allData.length > 0) {
            renderMenu(allData);
            handleHashNavigation();
        }
    } catch (err) {
        document.getElementById('content-area').innerHTML = `<h2>错误: ${err.message}</h2>`;
    }
}

// 解析 Markdown 内容
function parseMarkdownContent(filename, rawText) {
    const results = [];
    const parts = rawText.split(/<details/i);
    
    parts.forEach(part => {
        const sStart = part.toLowerCase().indexOf('<summary>');
        const sEnd = part.toLowerCase().indexOf('</summary>');
        if (sStart !== -1 && sEnd !== -1) {
            const title = part.substring(sStart + 9, sEnd).replace(/<[^>]+>/g, '').trim();
            const dEnd = part.toLowerCase().indexOf('</details>');
            let content = (dEnd !== -1) ? part.substring(sEnd + 10, dEnd).trim() : part.substring(sEnd + 10).trim();
            content = content.replace(/={10,}/g, '');
            results.push({ title, content });
        }
    });
    
    return results;
}

function renderMenu(data) {
    const menuList = document.getElementById('menu-list');
    menuList.innerHTML = '';
    data.forEach((item) => {
        const li = document.createElement('li');
        li.className = 'menu-item';
        li.innerText = item.title;
        li.setAttribute('data-title', item.title);
        li.onclick = () => {
            window.location.hash = encodeURIComponent(item.title);
        };
        menuList.appendChild(li);
    });
}

function handleHashNavigation() {
    const hash = window.location.hash.substring(1);
    if (!hash) return;
    const targetTitle = decodeURIComponent(hash);
    const targetItem = allData.find(d => d.title === targetTitle);
    if (targetItem) {
        showContent(targetItem);
        document.querySelectorAll('.menu-item').forEach(el => {
            el.classList.toggle('active', el.getAttribute('data-title') === targetTitle);
        });
    }
}

window.addEventListener('hashchange', handleHashNavigation);

function showContent(item) {
    const container = document.getElementById('content-area');
    container.innerHTML = `<h1 class="content-title">${item.title}</h1>` + marked.parse(item.content);
    Prism.highlightAll();
    setTimeout(() => {
        addCopyButtons();
        renderMermaid();
        renderMath();
        addShareButton();
    }, 50);
    document.getElementById('main-view').scrollTop = 0;
}

function addCopyButtons() {
    document.querySelectorAll('pre').forEach(pre => {
        if (pre.querySelector('.copy-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerText = '复制';
        
        btn.onclick = () => {
            const code = pre.querySelector('code').innerText;
            navigator.clipboard.writeText(code).then(() => {
                btn.innerText = '已复制!';
                btn.classList.add('success');
                setTimeout(() => { btn.innerText = '复制'; btn.classList.remove('success'); }, 2000);
            });
        };
        
        pre.appendChild(btn);
    });
}

document.getElementById('search-input').oninput = function(e) {
    const term = e.target.value.toLowerCase();
    const filtered = allData.filter(item => 
        item.title.toLowerCase().includes(term) || item.content.toLowerCase().includes(term)
    );
    renderMenu(filtered);
};

mermaid.initialize({ 
    startOnLoad: false,
    theme: 'dark',
    securityLevel: 'loose',
    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'
});

// 自定义滚动条样式（通过 JavaScript 强制应用）
function applyCustomScrollbar() {
    const style = document.createElement('style');
    style.id = 'custom-scrollbar-style';
    style.textContent = `
        #menu-list::-webkit-scrollbar,
        #main-view::-webkit-scrollbar {
            width: 3px !important;
        }
        #menu-list::-webkit-scrollbar-track,
        #main-view::-webkit-scrollbar-track {
            background: transparent !important;
        }
        #menu-list::-webkit-scrollbar-thumb,
        #main-view::-webkit-scrollbar-thumb {
            background: #484f58 !important;
            border-radius: 0 !important;
        }
        #menu-list::-webkit-scrollbar-thumb:hover,
        #main-view::-webkit-scrollbar-thumb:hover {
            background: #7ee787 !important;
        }
    `;
    
    // 如果已存在则删除
    const existing = document.getElementById('custom-scrollbar-style');
    if (existing) existing.remove();
    
    // 添加到 head 的最后
    document.head.appendChild(style);
}

// 渲染 Mermaid 图表
async function renderMermaid() {
    const mermaidBlocks = document.querySelectorAll('.language-mermaid');
    if (mermaidBlocks.length === 0) return;

    for (const block of mermaidBlocks) {
        try {
            const pre = block.parentElement;
            if (!pre || pre.tagName !== 'PRE') continue;
            
            const graphDefinition = block.textContent;
            const { svg } = await mermaid.render('mermaid-' + Math.random().toString(36).substr(2, 9), graphDefinition);
            
            const wrapper = document.createElement('div');
            wrapper.className = 'mermaid-container';
            wrapper.innerHTML = svg;
            
            pre.replaceWith(wrapper);
        } catch (err) {
            console.error('渲染 Mermaid 图表失败:', err);
            block.textContent = '图表渲染失败: ' + err.message;
        }
    }
}

// 渲染数学公式
function renderMath() {
    const contentArea = document.getElementById('content-area');
    renderMathInElement(contentArea, {
        delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
        ],
        throwOnError: false
    });
}

// 添加分享按钮
function addShareButton() {
    const hash = window.location.hash.substring(1);
    if (!hash) return;
    
    const titleElement = document.querySelector('.content-title');
    if (titleElement && !document.querySelector('.share-btn')) {
        const btn = document.createElement('button');
        btn.className = 'share-btn';
        btn.innerHTML = '🔗 分享';
        btn.style.cssText = `
            float: right;
            padding: 8px 16px;
            background: var(--sidebar-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        `;
        btn.onmouseover = () => btn.style.background = '#444c56';
        btn.onmouseout = () => btn.style.background = 'var(--sidebar-bg)';
        btn.onclick = () => sharePage();
        titleElement.appendChild(btn);
    }
}

// 分享页面 - 复制 URL
function sharePage() {
    const url = window.location.href;
    const btn = document.querySelector('.share-btn');
    
    navigator.clipboard.writeText(url).then(() => {
        if (btn) {
            btn.innerHTML = '✅ 已复制';
            btn.style.background = '#238636';
            btn.style.color = 'white';
            btn.style.borderColor = '#238636';
            
            setTimeout(() => {
                btn.innerHTML = '🔗 分享';
                btn.style.background = 'var(--sidebar-bg)';
                btn.style.color = 'var(--text-color)';
                btn.style.borderColor = 'var(--border-color)';
            }, 2000);
        }
    }).catch(err => {
        // 降级方案：兼容不支持 clipboard API 的浏览器
        const input = document.createElement('input');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        
        if (btn) {
            btn.innerHTML = '✅ 已复制';
            setTimeout(() => {
                btn.innerHTML = '🔗 分享';
            }, 2000);
        }
    });
}

// 切换侧边栏
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const toggle = document.querySelector('.sidebar-toggle');
    
    sidebar.classList.toggle('collapsed');
    toggle.classList.toggle('collapsed');
    
    // 保存状态到 localStorage
    const isCollapsed = sidebar.classList.contains('collapsed');
    localStorage.setItem('sidebar-collapsed', isCollapsed);
}

// 初始化侧边栏状态
function initSidebarState() {
    const isCollapsed = localStorage.getItem('sidebar-collapsed');
    // 默认折叠侧边栏（如果没有设置过，默认折叠）
    if (isCollapsed === null || isCollapsed === 'true') {
        document.getElementById('sidebar').classList.add('collapsed');
        document.querySelector('.sidebar-toggle').classList.add('collapsed');
        localStorage.setItem('sidebar-collapsed', 'true');
    }
}

init();

// 页面加载完成后应用自定义滚动条
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
        applyCustomScrollbar();
        initSidebarState();
    });
} else {
    applyCustomScrollbar();
    initSidebarState();
}

// 延迟再次应用，确保覆盖所有样式
setTimeout(applyCustomScrollbar, 100);
setTimeout(applyCustomScrollbar, 500);
</script>
